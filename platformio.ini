; DeyeBridge - ESP32-S3 bridge for Deye/Sunsynk hybrid inverters
; Modbus RTU master -> Modbus TCP server (evcc) + MQTT (Home Assistant)

[platformio]
default_envs = esp32s3

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_ldf_mode = chain

[env:esp32s3]
platform = espressif32@^6.8.1
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool
# Two OTA app partitions (ota_0/ota_1) for HTTP firmware updates
board_build.partitions = min_spiffs.csv
lib_deps =
  knolleary/PubSubClient @ ^2.8
build_flags =
  -O2
  -std=gnu++17
  -D CORE_DEBUG_LEVEL=0

# Sanity firmware without RS485 hardware attached: the RTU master logs its
# frame attempts but never touches a bus, MQTT/TCP/web keep working.
[env:dummy]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -D DEYE_DUMMY_RTU

# Host-based unit tests for pure logic (CRC16, write queue, register window)
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  -<*>
  +<core/*.cpp>
  +<DeyeRegisters.cpp>
build_flags =
  -Isrc
  -Iinclude
  -std=gnu++17
